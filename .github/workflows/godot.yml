name: Godot Export

on:
  push:
    tags: ['v*']
    branches: ['feat-godot']
  workflow_dispatch:
    inputs:
      game_name:
        description: 'Game executable name'
        required: false
        default: 'drop-app-gd'
        type: string

env:
  GAME_NAME: ${{ github.event.inputs.game_name || 'drop-app-gd' }}

jobs:
  export:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        lfs: true

    - name: Setup Godot
      uses: firebelley/setup-godot@v7
      with:
        godot-version: "4.5" # not sure if 4.5 supported?

    - name: Install export templates
      run: |
        mkdir -p ~/.local/share/godot/export_templates
        wget -q https://github.com/godotengine/godot-builds/releases/download/4.5-stable/Godot_v4.5-stable_export_templates.tpz
        unzip -q Godot_v4.5-stable_export_templates.tpz -d ~/.local/share/godot/export_templates
        mv ~/.local/share/godot/export_templates/templates/* ~/.local/share/godot/export_templates/
        rm -rf ~/.local/share/godot/export_templates/templates

    - name: Create or update export_presets.cfg
      run: |
        # Create or update export presets with the correct game name
        if [ ! -f export_presets.cfg ]; then
          echo "Creating export_presets.cfg..."
          cat > export_presets.cfg << EOF
[preset.0]
name="Windows Desktop"
platform="Windows Desktop"
runnable=true
dedicated_server=false
custom_features=""
export_path="build/windows/$GAME_NAME.exe"
export_filter="all_resources"
include_filter=""
exclude_filter=""
export_files=""

[preset.1]
name="Linux/X11"
platform="Linux/X11"
runnable=true
dedicated_server=false
custom_features=""
export_path="build/linux/$GAME_NAME.x86_64"
export_filter="all_resources"
include_filter=""
exclude_filter=""
export_files=""

[preset.2]
name="Web"
platform="Web"
runnable=true
dedicated_server=false
custom_features=""
export_path="build/html/index.html"
export_filter="all_resources"
include_filter=""
exclude_filter=""
export_files=""
EOF
        else
          # Update existing export presets with the correct game name if needed?
          sed -i "s/export_path=.*\.exe/export_path=\"build\/windows\/$GAME_NAME.exe\"/" export_presets.cfg
          sed -i "s/export_path=.*\.x86_64/export_path=\"build\/linux\/$GAME_NAME.x86_64\"/" export_presets.cfg
        fi

    - name: Export Windows build
      run: |
        mkdir -p build/windows
        godot --headless --export-release "Windows Desktop" build/windows/$GAME_NAME.exe

    - name: Export Linux build
      run: |
        mkdir -p build/linux
        godot --headless --export-release "Linux/X11" build/linux/$GAME_NAME.x86_64

    - name: Export HTML5 build
      run: |
        mkdir -p build/html
        godot --headless --export-release "Web" build/html/index.html

    - name: Create ZIP archives
      run: |
        cd build/windows && zip -r ../${GAME_NAME}-windows.zip ./*
        cd ../linux && zip -r ../${GAME_NAME}-linux.zip ./*
        cd ../html && zip -r ../${GAME_NAME}-html.zip ./*

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ${{ env.GAME_NAME }}-builds
        path: |
          build/${{ env.GAME_NAME }}-windows.zip
          build/${{ env.GAME_NAME }}-linux.zip
          build/${{ env.GAME_NAME }}-html.zip

    - name: Create GitHub Release (on tags)
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: |
          build/${{ env.GAME_NAME }}-windows.zip
          build/${{ env.GAME_NAME }}-linux.zip
          build/${{ env.GAME_NAME }}-html.zip
